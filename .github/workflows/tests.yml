name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "A unittest module or test id to run; empty runs the whole suite"
        required: false
        type: string
        default: ""

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The major version the Dockerfile's NODE_MAJOR pins, so the tests
      # that run the real `node --check` run the image's grammar. It is
      # read from the Dockerfile's `ARG NODE_MAJOR=` line and named nowhere
      # else: the job fails when that line is absent or is not a number.
      - name: Read the node major version from the Dockerfile
        id: node
        run: |
          major="$(sed -n 's/^ARG NODE_MAJOR=\([0-9][0-9]*\)$/\1/p' Dockerfile)"
          if [ -z "$major" ]; then
            echo "The Dockerfile has no 'ARG NODE_MAJOR=<number>' line." >&2
            exit 1
          fi
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.major }}
      - name: Name the node the tests run
        env:
          NODE_MAJOR: ${{ steps.node.outputs.major }}
        run: node --version | grep -E "^v${NODE_MAJOR}\."
      - uses: astral-sh/setup-uv@v5
      - name: Install the rig and its dependency
        run: uv sync
      - name: Set the git identity for the tests
        run: |
          git config --global user.name "waymark-bench-ci"
          git config --global user.email "bench@waymark.invalid"
          git config --global init.defaultBranch main
      - name: Run the tests
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            uv run python -m unittest -v "$ONLY"
          else
            uv run python -m unittest -v
          fi
