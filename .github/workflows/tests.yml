name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install the rig and its dependency
        run: uv sync
      - name: Set the git identity for the tests
        run: |
          git config --global user.name "waymark-bench-ci"
          git config --global user.email "bench@waymark.invalid"
          git config --global init.defaultBranch main
      - name: Run the tests
        run: uv run python -m unittest -v
