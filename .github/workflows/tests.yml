name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "A unittest module or test id to run; empty runs the whole suite"
        required: false
        type: string
        default: ""

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The major version the Dockerfile's NODE_MAJOR pins, so the tests
      # that run the real `node --check` run the image's grammar.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Name the node the tests run
        run: node --version | grep -E '^v22\.'
      - uses: astral-sh/setup-uv@v5
      - name: Install the rig and its dependency
        run: uv sync
      - name: Set the git identity for the tests
        run: |
          git config --global user.name "waymark-bench-ci"
          git config --global user.email "bench@waymark.invalid"
          git config --global init.defaultBranch main
      - name: Run the tests
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            uv run python -m unittest -v "$ONLY"
          else
            uv run python -m unittest -v
          fi
