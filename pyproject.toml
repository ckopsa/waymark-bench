[project]
name = "waymark-bench"
version = "0.1.0"
description = "The bench rig: git worktrees, landings and feedback over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
]

[project.scripts]
bench = "bench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
